<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Сайт временно отключён</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080706;
        color: #f7f4ef;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .box {
        max-width: 460px;
        padding: 48px 36px;
        background: #12100e;
        border: 1px solid rgba(212, 175, 55, 0.25);
        border-radius: 12px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #d4af37;
        margin: 0 auto 20px;
        opacity: 0.8;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #f3e5ab;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #a89f91;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="dot"></div>
      <h1>Сайт временно отключён</h1>
      <p>В данный момент доступ к сайту приостановлен. Пожалуйста, зайдите позже.</p>
    </div>
  </body>
</html>
