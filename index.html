<!doctype html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA NOIR — Дом Высокой Парфюмерии</title>
    <!-- Google Fonts (Cyrillic, Latin & Arabic Amiri/Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --bg: #080706;
        --bg-elevated: #12100e;
        --bg-card: #161411;
        --bg-glass: rgba(18, 16, 14, 0.85);
        --gold: #d4af37;
        --gold-light: #f3e5ab;
        --gold-muted: #9e823c;
        --amber: #c88a4b;
        --text: #f7f4ef;
        --text-muted: #a69f94;
        --border: rgba(212, 175, 55, 0.18);
        --border-hover: rgba(212, 175, 55, 0.5);
        --font-serif: 'Cormorant Garamond', 'Amiri', Georgia, serif;
        --font-sans: 'Montserrat', 'Cairo', sans-serif;
        --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      html[lang="ar"] {
        --font-serif: 'Amiri', serif;
        --font-sans: 'Cairo', sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        line-height: 1.6;
        overflow-x: hidden;
        user-select: none;
        -webkit-user-select: none;
        background-image:
          radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.08), transparent 35%),
          radial-gradient(circle at 85% 30%, rgba(200, 138, 75, 0.06), transparent 35%),
          radial-gradient(circle at 50% 90%, rgba(212, 175, 55, 0.05), transparent 40%);
      }

      img {
        -webkit-user-drag: none;
        user-drag: none;
      }

      /* DEMO PROTECTION WATERMARK */
      .demo-watermark {
        position: fixed;
        bottom: 18px;
        left: 18px;
        z-index: 1500;
        padding: 8px 14px;
        border-radius: 6px;
        background: rgba(12, 10, 8, 0.88);
        border: 1px solid rgba(212, 175, 55, 0.45);
        color: var(--gold-light);
        font-size: 11px;
        letter-spacing: 1px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .demo-watermark i {
        color: var(--gold);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        outline: none;
        background: none;
      }

      input, select, textarea {
        font-family: inherit;
      }

      .container {
        width: min(1260px, calc(100% - 40px));
        margin: 0 auto;
      }

      /* TOP PROMO BAR */
      .promo-bar {
        background: linear-gradient(90deg, #1b160d, #2b2212, #1b160d);
        border-bottom: 1px solid var(--border);
        color: var(--gold-light);
        font-size: 12px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        text-align: center;
        padding: 9px 16px;
        font-weight: 500;
      }

      html[lang="ar"] .promo-bar {
        letter-spacing: 0;
        font-size: 13px;
      }

      /* HEADER */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg-glass);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--border);
      }

      .nav {
        height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .logo {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .logo-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 4px;
        color: var(--gold);
        line-height: 1;
      }

      .logo-sub {
        font-size: 9px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 4px;
      }

      html[lang="ar"] .logo-sub {
        letter-spacing: 0;
        font-size: 11px;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 28px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 500;
        color: var(--text-muted);
      }

      html[lang="ar"] .nav-links {
        letter-spacing: 0;
        font-size: 15px;
      }

      .nav-links a {
        position: relative;
        padding: 6px 0;
        transition: color 0.3s ease;
      }

      .nav-links a::after {
        content: "";
        position: absolute;
        bottom: 0;
        inset-inline-start: 0;
        width: 0;
        height: 1px;
        background: var(--gold);
        transition: width 0.3s ease;
      }

      .nav-links a:hover {
        color: var(--gold-light);
      }

      .nav-links a:hover::after {
        width: 100%;
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* LANGUAGE SWITCHER */
      .lang-switcher {
        display: inline-flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px;
        gap: 2px;
      }

      .lang-btn {
        padding: 6px 11px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 0.5px;
        transition: var(--transition);
      }

      .lang-btn:hover {
        color: var(--text);
      }

      .lang-btn.active {
        background: var(--gold);
        color: #080706;
        box-shadow: 0 2px 10px rgba(212, 175, 55, 0.35);
      }

      .icon-btn {
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid var(--border);
        color: var(--text);
        display: grid;
        place-items: center;
        font-size: 15px;
        transition: var(--transition);
        background: rgba(255, 255, 255, 0.02);
      }

      .icon-btn:hover {
        border-color: var(--gold);
        color: var(--gold);
        transform: translateY(-2px);
      }

      .badge {
        position: absolute;
        top: -4px;
        inset-inline-end: -4px;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--gold);
        color: #080706;
        font-size: 11px;
        font-weight: 700;
        display: grid;
        place-items: center;
      }

      .menu-toggle {
        display: none;
      }

      /* HERO SECTION */
      .hero {
        position: relative;
        padding: 85px 0 95px;
        overflow: hidden;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        align-items: center;
        gap: 50px;
      }

      .hero-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--gold-light);
        font-size: 11px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        margin-bottom: 24px;
        background: rgba(212, 175, 55, 0.06);
      }

      html[lang="ar"] .hero-eyebrow {
        letter-spacing: 0;
        font-size: 13px;
      }

      .hero h1 {
        font-family: var(--font-serif);
        font-size: clamp(42px, 5.8vw, 74px);
        font-weight: 500;
        line-height: 1.1;
        margin-bottom: 24px;
      }

      .hero h1 em {
        font-style: italic;
        color: var(--gold);
      }

      .hero-desc {
        font-size: 16px;
        color: var(--text-muted);
        max-width: 550px;
        margin-bottom: 36px;
        font-weight: 300;
        line-height: 1.8;
      }

      .hero-buttons {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 48px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 52px;
        padding: 0 28px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        transition: var(--transition);
      }

      html[lang="ar"] .btn {
        letter-spacing: 0;
        font-size: 14px;
      }

      .btn-gold {
        background: linear-gradient(135deg, #d4af37, #b38728);
        color: #080706;
        box-shadow: 0 10px 30px rgba(212, 175, 55, 0.25);
      }

      .btn-gold:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(212, 175, 55, 0.4);
        filter: brightness(1.08);
      }

      .btn-outline {
        border: 1px solid var(--border-hover);
        color: var(--text);
        background: rgba(255, 255, 255, 0.02);
      }

      .btn-outline:hover {
        border-color: var(--gold);
        color: var(--gold);
        background: rgba(212, 175, 55, 0.08);
        transform: translateY(-3px);
      }

      .hero-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding-top: 28px;
        border-top: 1px solid var(--border);
        max-width: 520px;
      }

      .stat-num {
        font-family: var(--font-serif);
        font-size: 32px;
        font-weight: 600;
        color: var(--gold);
        line-height: 1;
      }

      .stat-label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-top: 6px;
      }

      html[lang="ar"] .stat-label {
        letter-spacing: 0;
        font-size: 12px;
      }

      .hero-Showcase {
        position: relative;
        display: flex;
        justify-content: center;
      }

      .hero-image-frame {
        position: relative;
        width: 100%;
        max-width: 440px;
        height: 540px;
        border-radius: 220px 220px 16px 16px;
        overflow: hidden;
        border: 1px solid var(--border-hover);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 50px rgba(212, 175, 55, 0.15);
      }

      .hero-image-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.8s ease;
      }

      .hero-image-frame:hover img {
        transform: scale(1.05);
      }

      .floating-badge {
        position: absolute;
        bottom: 30px;
        inset-inline-start: -10px;
        background: rgba(18, 16, 14, 0.92);
        border: 1px solid var(--border-hover);
        padding: 16px 22px;
        border-radius: 8px;
        backdrop-filter: blur(12px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      }

      .floating-badge span {
        display: block;
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--gold);
      }

      .floating-badge strong {
        font-family: var(--font-serif);
        font-size: 20px;
        font-weight: 600;
      }

      /* SECTION STYLING */
      .section {
        padding: 85px 0;
      }

      .section-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 44px;
        flex-wrap: wrap;
      }

      .section-subtitle {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--gold);
        margin-bottom: 8px;
        display: block;
      }

      html[lang="ar"] .section-subtitle {
        letter-spacing: 0;
        font-size: 13px;
      }

      .section-title {
        font-family: var(--font-serif);
        font-size: clamp(32px, 4.5vw, 48px);
        font-weight: 500;
        line-height: 1.15;
      }

      /* CATALOG CONTROLS */
      .catalog-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 36px;
        flex-wrap: wrap;
        background: var(--bg-elevated);
        padding: 18px 24px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .filter-btn {
        padding: 9px 18px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text-muted);
        font-size: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        transition: var(--transition);
      }

      html[lang="ar"] .filter-btn {
        letter-spacing: 0;
        font-size: 14px;
      }

      .filter-btn:hover {
        border-color: var(--gold);
        color: var(--text);
      }

      .filter-btn.active {
        background: var(--gold);
        color: #080706;
        border-color: var(--gold);
        font-weight: 600;
      }

      .search-sort-group {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .search-wrapper {
        position: relative;
        width: 270px;
      }

      .search-wrapper input {
        width: 100%;
        height: 40px;
        padding-inline-start: 38px;
        padding-inline-end: 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        font-size: 13px;
        outline: none;
        transition: border-color 0.3s ease;
      }

      .search-wrapper input:focus {
        border-color: var(--gold);
      }

      .search-wrapper i {
        position: absolute;
        inset-inline-start: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 13px;
      }

      .sort-select {
        height: 40px;
        padding: 0 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        font-size: 13px;
        outline: none;
        cursor: pointer;
      }

      /* PRODUCT GRID */
      .products-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
      }

      .product-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: var(--transition);
        position: relative;
      }

      .product-card:hover {
        transform: translateY(-8px);
        border-color: var(--border-hover);
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.1);
      }

      .product-img-wrap {
        position: relative;
        height: 320px;
        overflow: hidden;
        background: #0d0b09;
        cursor: pointer;
      }

      .product-img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
      }

      .product-card:hover .product-img-wrap img {
        transform: scale(1.07);
      }

      .product-badges {
        position: absolute;
        top: 14px;
        inset-inline-start: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 2;
      }

      .tag-badge {
        padding: 5px 10px;
        background: rgba(8, 7, 6, 0.85);
        border: 1px solid var(--gold);
        color: var(--gold-light);
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: 600;
        backdrop-filter: blur(6px);
      }

      .fav-btn {
        position: absolute;
        top: 14px;
        inset-inline-end: 14px;
        z-index: 2;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(8, 7, 6, 0.75);
        border: 1px solid var(--border);
        color: var(--text);
        display: grid;
        place-items: center;
        transition: var(--transition);
        backdrop-filter: blur(6px);
      }

      .fav-btn:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      .fav-btn.active {
        color: #e74c3c;
        border-color: #e74c3c;
      }

      .product-body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .product-brand {
        font-size: 11px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 4px;
      }

      .product-title {
        font-family: var(--font-serif);
        font-size: 25px;
        font-weight: 600;
        margin-bottom: 8px;
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .product-title:hover {
        color: var(--gold-light);
      }

      .product-notes-preview {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 18px;
        display: -webkit-box;
        line-clamp: 2;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .product-footer {
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .product-price {
        font-family: var(--font-serif);
        font-size: 24px;
        font-weight: 600;
        color: var(--text);
      }

      .product-price span {
        display: block;
        font-family: var(--font-sans);
        font-size: 10px;
        color: var(--text-muted);
        font-weight: 400;
      }

      .product-actions {
        display: flex;
        gap: 8px;
      }

      .btn-icon-only {
        width: 42px;
        height: 42px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        display: grid;
        place-items: center;
        transition: var(--transition);
      }

      .btn-icon-only:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      .btn-buy {
        height: 42px;
        padding: 0 16px;
        background: var(--gold);
        color: #080706;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: var(--transition);
      }

      .btn-buy:hover {
        background: var(--gold-light);
        transform: translateY(-2px);
      }

      /* SCENT FAMILIES SECTION */
      .families-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }

      .family-card {
        position: relative;
        height: 260px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 24px;
        isolation: isolate;
        transition: var(--transition);
      }

      .family-card:hover {
        border-color: var(--gold);
        transform: translateY(-5px);
      }

      .family-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(8, 7, 6, 0.95), rgba(8, 7, 6, 0.25)), var(--bg-img);
        background-size: cover;
        background-position: center;
        z-index: -1;
        transition: transform 0.6s ease;
      }

      .family-card:hover::before {
        transform: scale(1.08);
      }

      .family-card h3 {
        font-family: var(--font-serif);
        font-size: 26px;
        color: var(--gold-light);
        margin-bottom: 4px;
      }

      .family-card p {
        font-size: 12px;
        color: var(--text-muted);
      }

      /* SCENT QUIZ BANNER */
      .quiz-banner {
        background: linear-gradient(135deg, #17130d, #0f0d0a);
        border: 1px solid var(--border-hover);
        border-radius: 12px;
        padding: 56px;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        align-items: center;
        gap: 40px;
        position: relative;
        overflow: hidden;
      }

      .quiz-banner h2 {
        font-family: var(--font-serif);
        font-size: clamp(30px, 4vw, 44px);
        margin-bottom: 16px;
      }

      .quiz-banner p {
        color: var(--text-muted);
        margin-bottom: 28px;
        max-width: 540px;
      }

      /* JOURNAL / ARTICLES */
      .journal-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 26px;
      }

      .journal-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: var(--transition);
      }

      .journal-card:hover {
        border-color: var(--gold);
        transform: translateY(-6px);
      }

      .journal-img {
        height: 220px;
        width: 100%;
        object-fit: cover;
      }

      .journal-body {
        padding: 24px;
      }

      .journal-tag {
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--gold);
        display: block;
        margin-bottom: 8px;
      }

      .journal-card h3 {
        font-family: var(--font-serif);
        font-size: 24px;
        margin-bottom: 10px;
        line-height: 1.25;
      }

        margin-bottom: 50px;

      .footer h4 {
        font-family: var(--font-serif);
        font-size: 20px;
        color: var(--gold);
        margin-bottom: 18px;
      }

        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .footer-links a:hover {
        color: var(--gold-light);
      }

        display: flex;
        gap: 8px;
        margin-top: 14px;
      }

        flex: 1;
        height: 42px;
        padding: 0 14px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        outline: none;
      }

      .footer-bottom {
        padding-top: 28px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
        flex-wrap: wrap;
        gap: 14px;
      }

      /* MODALS & DRAWERS */
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(4, 3, 2, 0.85);
        backdrop-filter: blur(12px);
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .backdrop.active {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-window {
        position: relative;
        width: min(920px, 100%);
        max-height: 90vh;
        background: var(--bg-elevated);
        border: 1px solid var(--border-hover);
        border-radius: 10px;
        overflow-y: auto;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
        transform: translateY(20px) scale(0.96);
        transition: var(--transition);
      }

      .backdrop.active .modal-window {
        transform: translateY(0) scale(1);
      }

      .modal-close-btn {
        position: absolute;
        top: 18px;
        inset-inline-end: 18px;
        z-index: 10;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(8, 7, 6, 0.8);
        border: 1px solid var(--border);
        color: var(--text);
        display: grid;
        place-items: center;
        font-size: 16px;
        transition: var(--transition);
      }

      .modal-close-btn:hover {
        border-color: var(--gold);
        color: var(--gold);
        transform: rotate(90deg);
      }

      /* PRODUCT DETAIL MODAL */
      .product-modal-grid {
        display: grid;
        grid-template-columns: 0.95fr 1.05fr;
      }

      .product-modal-img {
        width: 100%;
        height: 100%;
        min-height: 460px;
        object-fit: cover;
      }

      .product-modal-info {
        padding: 36px;
        display: flex;
        flex-direction: column;
      }

      /* OLFACTORY PYRAMID */
      .pyramid-box {
        margin: 22px 0;
        padding: 18px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .pyramid-title {
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pyramid-tier {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
        font-size: 13px;
      }

      .pyramid-tier:last-child {
        border-bottom: none;
      }

      .tier-label {
        min-width: 125px;
        font-weight: 600;
        color: var(--gold-light);
        font-size: 12px;
      }

      .tier-notes {
        color: var(--text-muted);
      }

      /* VOLUME SELECTOR */
      .volume-selector {
        display: flex;
        gap: 10px;
        margin: 16px 0 24px;
      }

      .vol-btn {
        flex: 1;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        transition: var(--transition);
      }

      .vol-btn.active {
        border-color: var(--gold);
        background: rgba(212, 175, 55, 0.15);
        color: var(--gold-light);
      }

      /* SIDE DRAWER (CART & FAVORITES) */
      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(4, 3, 2, 0.8);
        backdrop-filter: blur(8px);
        z-index: 1100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .drawer-backdrop.active {
        opacity: 1;
        pointer-events: auto;
      }

      .drawer {
        position: fixed;
        top: 0;
        inset-inline-end: 0;
        width: min(440px, 100%);
        height: 100vh;
        background: var(--bg-elevated);
        border-inline-start: 1px solid var(--border-hover);
        z-index: 1101;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      html[dir="rtl"] .drawer {
        transform: translateX(-100%);
      }

      .drawer-backdrop.active .drawer {
        transform: translateX(0);
      }

      .drawer-header {
        padding: 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .drawer-header h3 {
        font-family: var(--font-serif);
        font-size: 26px;
        color: var(--gold);
      }

      .drawer-body {
        padding: 24px;
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .cart-item {
        display: flex;
        gap: 14px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .cart-item img {
        width: 72px;
        height: 86px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      .cart-item-info {
        flex: 1;
      }

      .cart-item-title {
        font-family: var(--font-serif);
        font-size: 19px;
        font-weight: 600;
      }

      .cart-item-meta {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 8px;
      }

      .qty-controls {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      .qty-btn {
        width: 26px;
        height: 26px;
        color: var(--text);
        font-size: 12px;
      }

      .qty-val {
        padding: 0 10px;
        font-size: 12px;
      }

      .drawer-footer {
        padding: 24px;
        border-top: 1px solid var(--border);
        background: #0d0b09;
      }

      .cart-total-row {
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        margin-bottom: 18px;
      }

      .cart-total-row strong {
        font-family: var(--font-serif);
        font-size: 26px;
        color: var(--gold);
      }

      /* TOAST */
      .toast {
        position: fixed;
        bottom: 28px;
        inset-inline-end: 28px;
        z-index: 2000;
        background: #171410;
        border: 1px solid var(--gold);
        color: var(--text);
        padding: 15px 22px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        transform: translateY(100px);
        opacity: 0;
        transition: var(--transition);
      }

      .toast.active {
        transform: translateY(0);
        opacity: 1;
      }

      .toast i {
        color: var(--gold);
        font-size: 18px;
      }

      /* QUIZ OPTIONS */
      .quiz-options {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin: 22px 0;
      }

      .quiz-option-btn {
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 6px;
        text-align: start;
        color: var(--text);
        background: rgba(255, 255, 255, 0.02);
        transition: var(--transition);
      }

      .quiz-option-btn:hover {
        border-color: var(--gold);
        background: rgba(212, 175, 55, 0.08);
      }

      .quiz-option-btn strong {
        display: block;
        font-family: var(--font-serif);
        font-size: 20px;
        color: var(--gold-light);
        margin-bottom: 4px;
      }

      .quiz-option-btn span {
        font-size: 12px;
        color: var(--text-muted);
      }

      /* RESPONSIVE */
      @media (max-width: 992px) {
        .hero-grid,
        .quiz-banner,
        .product-modal-grid {
          grid-template-columns: 1fr;
        }
        .products-grid,
        .journal-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .families-grid,
        .footer-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .hero-image-frame {
          height: 420px;
        }
        .nav-links {
          position: absolute;

          left: 20px;
          right: 20px;

          border: 1px solid var(--border-hover);
          padding: 24px;
          flex-direction: column;
          display: none;
        }
        .nav-links.active {
          display: flex;
        }
        .menu-toggle {
          display: grid;
        }
      }

      @media (max-width: 576px) {
        .products-grid,
        .families-grid,
        .journal-grid,
        .footer-grid,
        .quiz-options {
          grid-template-columns: 1fr;
        }
        .quiz-banner {
          padding: 32px 22px;
        }
        .logo-title {
          font-size: 22px;
        }
      }
    </style>
  </head>

      // RENDER CATALOG
      function renderCatalog() {
        const t = I18N[currentLang];
        const container = document.getElementById("productsContainer");

        let list = PERFUMES.filter((p) => {
          const matchesCat = activeFilter === "all" || p.familyKey === activeFilter;
          const q = searchQuery.toLowerCase();
          const matchesSearch =
            p.name.toLowerCase().includes(q) ||
            p.topNotes[currentLang].toLowerCase().includes(q) ||
            p.heartNotes[currentLang].toLowerCase().includes(q) ||
            p.baseNotes[currentLang].toLowerCase().includes(q) ||
            p.description[currentLang].toLowerCase().includes(q);
          return matchesCat && matchesSearch;
        });

        if (sortOrder === "price-asc") {
          list.sort((a, b) => a.basePriceRub - b.basePriceRub);
        } else if (sortOrder === "price-desc") {
          list.sort((a, b) => b.basePriceRub - a.basePriceRub);
        }

        if (list.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted);">

              <p>${t.noProductsDesc}</p>
            </div>
          `;
          return;

        container.innerHTML = list
          .map((p) => {
            const isFav = favorites.has(p.id);

      // CART & FAVORITES
      function addToCart(id, volKey = "vol50", mult = 1) {
        const p = PERFUMES.find((item) => item.id === id);
        if (!p) return;
        const t = I18N[currentLang];
        const existing = cart.find((item) => item.id === id && item.volKey === volKey);
        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({ id, volKey, mult, qty: 1 });
        }
        updateBadges();
        showToast(`«${p.name}» (${t[volKey]}) — ${t.toastAddedCart}`);
      }

      function toggleFavorite(id) {
        const p = PERFUMES.find((item) => item.id === id);
        const t = I18N[currentLang];
        if (favorites.has(id)) {
          favorites.delete(id);
          showToast(`«${p.name}» — ${t.toastRemovedFav}`);
        } else {
          favorites.add(id);
          showToast(`«${p.name}» — ${t.toastAddedFav}`);
        }
        updateBadges();
        renderCatalog();
      }

      function updateBadges() {
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);

        const t = I18N[currentLang];
        drawerTitle.textContent = t.cartTitle;
        if (cart.length === 0) {
          drawerBody.innerHTML = `
            <div style="text-align: center; padding: 60px 10px; color: var(--text-muted);">
              <i class="fa-solid fa-bag-shopping" style="font-size: 40px; color: var(--gold); margin-bottom: 14px; opacity: 0.6;"></i>
              <p>${t.cartEmpty}</p>
            </div>
          `;
          drawerFooter.innerHTML = "";
        } else {
          let totalRub = 0;
          drawerBody.innerHTML = cart
            .map((item, idx) => {
              const p = PERFUMES.find((x) => x.id === item.id);
              const unitRub = Math.round(p.basePriceRub * item.mult);
              const lineRub = unitRub * item.qty;
              totalRub += lineRub;
              return `
                <div class="cart-item">
                  <img src="${p.image}" alt="${p.name}" />
                  <div class="cart-item-info">
                    <div class="cart-item-title">${p.name}</div>

                      </div>
                      <strong style="color: var(--gold-light); font-size: 14px;">${formatPrice(lineRub)}</strong>
                    </div>
                  </div>
                </div>
              `;
            })
            .join("");

          drawerFooter.innerHTML = `
            <div class="cart-total-row">
              <span>${t.totalLabel}</span>
              <strong>${formatPrice(totalRub)}</strong>
            </div>
            <button class="btn btn-gold" id="checkoutBtn" style="width: 100%;">

          en: { tag: "Boutiques", title: "Flagship Spaces", body: "<p>• <strong>Paris:</strong> 218 Rue Saint-Honoré<br>• <strong>Dubai:</strong> The Dubai Mall, Fashion Avenue<br>• <strong>Moscow:</strong> Malaya Bronnaya, 24</p>" },
          ar: { tag: "الفروع والبوتيكات", title: "بوتيكات أورا نوار", body: "<p>• <strong>دبي:</strong> دبي مول — فاشن أفنيو<br>• <strong>الرياض:</strong> سنتريا مول<br>• <strong>باريس:</strong> شارع سانت أونوريه ٢١٨</p>" }
        }
      };

      document.getElementById("aboutBrandBtn").addEventListener("click", (e) => {
        e.preventDefault();
        const m = INFO_MODALS.about[currentLang];
        openGenericModal(m.tag, m.title, m.body);
      });

      document.getElementById("deliveryInfoBtn").addEventListener("click", (e) => {
        e.preventDefault();
        const m = INFO_MODALS.delivery[currentLang];
        openGenericModal(m.tag, m.title, m.body);
      });

      document.getElementById("sampleSetBtn").addEventListener("click", (e) => {
        e.preventDefault();
        const m = INFO_MODALS.samples[currentLang];
        openGenericModal(m.tag, m.title, m.body);
      });

      document.getElementById("contactsModalBtn").addEventListener("click", (e) => {
        e.preventDefault();
        const m = INFO_MODALS.contacts[currentLang];
        openGenericModal(m.tag, m.title, m.body);
      });

      // Mobile Menu
      document.getElementById("menuToggleBtn").addEventListener("click", () => {
        document.getElementById("navLinks").classList.toggle("active");
      });

      // Newsletter
      document.getElementById("newsletterForm").addEventListener("submit", (e) => {
        e.preventDefault();
        showToast(I18N[currentLang].toastSubscribed);
        e.target.reset();
      });

      // INITIALIZE WITH SAVED OR DEFAULT LANGUAGE
      setLanguage(currentLang);

      // =========================================================================
      // ЗАЩИТА ОТ КОПИРОВАНИЯ ДО ПРОДАЖИ (УДАЛИТЬ ЭТОТ БЛОК ПОСЛЕ ОПЛАТЫ КЛИЕНТОМ)
      // =========================================================================
      const ENABLE_DEMO_PROTECTION = true;

      if (ENABLE_DEMO_PROTECTION) {
        const protectMsgs = {
          ru: "🔒 Демо-версия защищена от копирования. Для покупки исходного кода свяжитесь с автором.",
          en: "🔒 This demo is copy-protected. Contact the developer to purchase the source code.",
          ar: "🔒 هذه النسخة التجريبية محمية ضد النسخ. تواصل مع المطور لشراء الكود الكامل."
        };

        // 1. Запрет правой кнопки мыши
        document.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          showToast(protectMsgs[currentLang] || protectMsgs.ru);
        });

        // 2. Запрет перетаскивания и копирования текста
        document.addEventListener("dragstart", (e) => e.preventDefault());
        document.addEventListener("copy", (e) => {
          e.preventDefault();
          showToast(protectMsgs[currentLang] || protectMsgs.ru);
        });

        // 3. Запрет горячих клавиш сохранения и просмотра кода (F12, Ctrl+S, Ctrl+U, Ctrl+Shift+I/J/C)
        document.addEventListener("keydown", (e) => {
          const key = e.key.toLowerCase();
          const isDevTools =
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey && (key === "i" || key === "j" || key === "c" || key === "и" || key === "о" || key === "с")) ||
            (e.ctrlKey && (key === "u" || key === "s" || key === "p" || key === "г" || key === "ы" || key === "з"));

          if (isDevTools) {
            e.preventDefault();
            showToast(protectMsgs[currentLang] || protectMsgs.ru);
            return false;
          }
        });
      }
    </script>
  </body>
</html>
